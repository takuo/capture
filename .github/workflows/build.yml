name: Build Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Run build
        env:
          R2_BUCKET_NAME: example-bucket
          R2_DOMAIN: example.com
          CORS_ORIGINS: https://example.com
        run: |
          envsubst < wrangler.json > deploy.json
          npx wrangler deploy -c deploy.json --dry-run --outdir=dist
